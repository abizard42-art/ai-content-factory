
name: Generate contextual presenter scenes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-news-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate contextual scene images from latest presenter storyboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name belum diisi."
              exit 1
            fi
          done

          channel_result=$(curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/channels?name=eq.Sejarah%20Dunia&select=id&limit=1" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}")
          channel_id=$(printf '%s' "$channel_result" | jq -r '.[0].id // empty')
          [ -n "$channel_id" ] || { echo "ERROR: Channel tidak ditemukan."; exit 1; }

          topics_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/topics" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "channel_id=eq.$channel_id" \
            --data-urlencode "select=id,title" --data-urlencode "order=created_at.desc" --data-urlencode "limit=1")
          topic_id=$(printf '%s' "$topics_result" | jq -r '.[0].id // empty')
          topic_title=$(printf '%s' "$topics_result" | jq -r '.[0].title // empty')
          [ -n "$topic_id" ] || { echo "ERROR: Topik tidak ditemukan."; exit 1; }

          scripts_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/scripts" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "topic_id=eq.$topic_id" \
            --data-urlencode "select=id,storyboard" --data-urlencode "order=created_at.desc" --data-urlencode "limit=1")
          script_id=$(printf '%s' "$scripts_result" | jq -r '.[0].id // empty')
          storyboard=$(printf '%s' "$scripts_result" | jq -c '.[0].storyboard // empty')
          [ -n "$script_id" ] && [ "$storyboard" != "null" ] && [ -n "$storyboard" ] || {
            echo "ERROR: Script/storyboard tidak ditemukan."; exit 1;
          }

          scene_count=$(printf '%s' "$storyboard" | jq 'if type == "array" then length else 0 end')
          [ "$scene_count" -ge 1 ] || { echo "ERROR: Storyboard kosong."; exit 1; }

          mkdir -p output
          echo "Topik: $topic_title"
          echo "Script ID: $script_id"
          echo "Jumlah adegan: $scene_count"

          for ((i=0; i<scene_count; i++)); do
            scene=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].scene // ($i+1)')
            visual=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].visual_prompt // empty')
            expression=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].raka_expression // "friendly attentive presenter expression"')
            action=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].raka_action // "open-hand presenter gesture"')
            background=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].background_action // "historically relevant people performing the narrated event"')
            setting=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].historical_setting // "the civilization, region, and period stated by the narration"')
            continuity=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].location_continuity // "maintain the same historically accurate location unless narration explicitly changes it"')

            [ -n "$visual" ] || { echo "ERROR: visual_prompt scene $scene kosong."; exit 1; }
            printf -v scene_label "%02d" "$scene"

            full_prompt="Vertical 2D anime-inspired educational history cartoon. HISTORICAL SETTING: $setting. LOCATION CONTINUITY: $continuity. Show ONLY the correct civilization, architecture, clothing, landscape and historical period. No unrelated Vikings, Norse, Aztec or Roman backgrounds. If the story is about Ancient Egypt, remain in Ancient Egypt unless narration explicitly changes location. RAKA: same recurring young adult male host, thick slightly tousled black hair, expressive dark eyes, tan-brown explorer jacket, plain black shirt, compass pendant and small globe emblem. Preserve his recognizable appearance and outfit. Energetic history news presenter, not passive. Expression: $expression. Gesture: $action. Background activity: $background. Scene: $visual. Historically accurate, expressive body language, cinematic warm lighting, clear foreground/background separation. No text, captions or watermark."

            # FLUX Schnell menerima prompt maksimal 2048 karakter.
            # Sisakan ruang aman untuk batas tersebut.
            prompt=$(printf '%s' "$full_prompt" | cut -c1-1950)
            prompt_length=${#prompt}
            echo "Scene $scene_label: panjang prompt ${prompt_length}/2048 karakter."

            request=$(jq -n --arg prompt "$prompt" '{prompt:$prompt,steps:4}')
            echo "Meminta gambar scene $scene_label ke Cloudflare..."

            http_status=$(curl --silent --show-error \
              --output cloudflare-response.json \
              --write-out "%{http_code}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell" \
              -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" -d "$request" || true)

            if [ "$http_status" != "200" ]; then
              echo "ERROR: Cloudflare gagal. HTTP $http_status"
              jq . cloudflare-response.json 2>/dev/null || head -c 3000 cloudflare-response.json
              exit 1
            fi

            response=$(cat cloudflare-response.json)
            image_base64=$(printf '%s' "$response" | jq -r '.result.image // .image // empty')
            [ -n "$image_base64" ] || {
              echo "ERROR: Gambar scene $scene_label tidak ditemukan dalam respons."
              printf '%s' "$response" | jq '{success,errors,messages}'
              exit 1
            }

            image_file="scene-${scene_label}.jpg"
            printf '%s' "$image_base64" | base64 --decode > "output/$image_file"
            [ -s "output/$image_file" ] || { echo "ERROR: Gambar kosong."; exit 1; }

            object_path="raka/news-experiment/${script_id}/$image_file"
            curl --fail-with-body --silent --show-error -X POST \
              "${SUPABASE_URL}/storage/v1/object/visual-assets/$object_path" \
              -H "apikey: ${SUPABASE_SECRET_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
              -H "Content-Type: image/jpeg" -H "x-upsert: true" \
              --data-binary @"output/$image_file" >/dev/null

            echo "BERHASIL: $image_file tersimpan."
          done

          echo "SELESAI: Semua gambar eksperimen selesai."
          echo "Lokasi: visual-assets/raka/news-experiment/${script_id}/"
          ls -lh output/
