name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gemini API connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          result=$(curl --silent --show-error --write-out '\n__HTTP_STATUS__:%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Balas tepat dengan kalimat: Koneksi AI Content Factory berhasil."
                }]
              }]
            }' || true)

          http_status=$(printf '%s\n' "$result" | sed -n 's/^__HTTP_STATUS__://p' | tail -n 1)
          response=$(printf '%s\n' "$result" | sed '/^__HTTP_STATUS__:/d')

          echo "HTTP status: ${http_status:-unknown}"
          echo "Gemini response:"
          printf '%s\n' "$response" | jq .

          if [ -z "${http_status:-}" ] || [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Gemini API request failed. Read the response above."
            exit 1
          fi

          printf '%s\n' "$response" | jq -r '.candidates[0].content.parts[]?.text // empty'
          echo "Gemini API request completed successfully."
