name: Generate contextual scenes with Raka reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-reference-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate all scenes with the master Raka image reference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name belum diisi."
              exit 1
            fi
          done

          # Master reference tetap memakai gambar Raka pilihan user.
          MASTER_SCRIPT_ID="444b9f67-8fa6-4fe7-a021-2e380eba6345"
          curl --fail-with-body --silent --show-error             "${SUPABASE_URL}/storage/v1/object/visual-assets/raka/news-experiment/${MASTER_SCRIPT_ID}/scene-07.jpg"             -H "apikey: ${SUPABASE_SECRET_KEY}"             -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"             -o raka-master.jpg

          [ -s raka-master.jpg ] || { echo "ERROR: Master reference Raka tidak ditemukan."; exit 1; }

          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("raka-master.jpg").convert("RGB")
          img.resize((512, 512), Image.Resampling.LANCZOS).save("raka-reference-512.jpg", quality=92)
          print("Master Raka siap digunakan sebagai referensi 512x512.")
          PY

          channel_result=$(curl --fail-with-body --silent --show-error             "${SUPABASE_URL}/rest/v1/channels?name=eq.Sejarah%20Dunia&select=id&limit=1"             -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}")
          channel_id=$(printf '%s' "$channel_result" | jq -r '.[0].id // empty')
          [ -n "$channel_id" ] || { echo "ERROR: Channel tidak ditemukan."; exit 1; }

          topics_result=$(curl --fail-with-body --silent --show-error --get             "${SUPABASE_URL}/rest/v1/topics"             -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"             --data-urlencode "channel_id=eq.$channel_id"             --data-urlencode "select=id,title" --data-urlencode "order=created_at.desc" --data-urlencode "limit=1")
          topic_id=$(printf '%s' "$topics_result" | jq -r '.[0].id // empty')
          topic_title=$(printf '%s' "$topics_result" | jq -r '.[0].title // empty')
          [ -n "$topic_id" ] || { echo "ERROR: Topik tidak ditemukan."; exit 1; }

          scripts_result=$(curl --fail-with-body --silent --show-error --get             "${SUPABASE_URL}/rest/v1/scripts"             -H "apikey: ${SUPABASE_SECRET_KEY}" -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"             --data-urlencode "topic_id=eq.$topic_id"             --data-urlencode "select=id,storyboard" --data-urlencode "order=created_at.desc" --data-urlencode "limit=1")
          script_id=$(printf '%s' "$scripts_result" | jq -r '.[0].id // empty')
          storyboard=$(printf '%s' "$scripts_result" | jq -c '.[0].storyboard // empty')
          [ -n "$script_id" ] && [ "$storyboard" != "null" ] && [ -n "$storyboard" ] || {
            echo "ERROR: Script/storyboard tidak ditemukan."; exit 1;
          }

          scene_count=$(printf '%s' "$storyboard" | jq 'if type == "array" then length else 0 end')
          [ "$scene_count" -ge 1 ] || { echo "ERROR: Storyboard kosong."; exit 1; }

          mkdir -p output
          echo "Topik: $topic_title"
          echo "Script ID: $script_id"
          echo "Jumlah adegan: $scene_count"
          echo "Model: FLUX.2 Klein 4B dengan master reference Raka."

          for ((i=0; i<scene_count; i++)); do
            scene=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].scene // ($i+1)')
            visual=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].visual_prompt // empty')
            raka_presence=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].raka_presence // true')
            expression=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].raka_expression // "friendly attentive presenter expression"')
            action=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].raka_action // "open-hand presenter gesture"')
            background=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].background_action // "historically relevant people performing the narrated event"')
            setting=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].historical_setting // "the civilization, region, and period stated by the narration"')
            continuity=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].location_continuity // "maintain the same historically accurate location unless narration explicitly changes it"')

            [ -n "$visual" ] || { echo "ERROR: visual_prompt scene $scene kosong."; exit 1; }
            printf -v scene_label "%02d" "$scene"

            # Jangan buat ulang gambar yang sudah berhasil diunggah.
            object_path="raka/news-reference-scenes/${script_id}/scene-${scene_label}.jpg"
            existing_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "${SUPABASE_URL}/storage/v1/object/visual-assets/${object_path}" \
              -H "apikey: ${SUPABASE_SECRET_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" || true)
            if [ "$existing_status" = "200" ]; then
              echo "SKIP: scene-${scene_label}.jpg sudah ada, dipertahankan."
              continue
            fi

            # Ikuti raka_presence dari storyboard; tidak ada scene yang dipaksa menampilkan Raka.
            if [ "$raka_presence" = "true" ]; then
              full_prompt="Use image 0 as the identity reference for the SAME recurring character Raka. Preserve his recognizable face, large brown eyes, warm medium-tan skin tone, thick tousled black hair, youthful facial proportions, tan-brown explorer jacket, black shirt and compass pendant. Do not redesign him. Create a vertical 2D anime-inspired educational history illustration. HISTORICAL SETTING: $setting. LOCATION CONTINUITY: $continuity. Show only the correct civilization, architecture, clothing, landscape and period. Raka is the modern presenter in the foreground. Expression: $expression. Gesture: $action. Background activity: $background. Scene: $visual. Historically accurate, cinematic warm lighting, clear composition. No text, captions or watermark."
              prompt=$(printf '%s' "$full_prompt" | cut -c1-1950)
              echo "Scene $scene_label: Raka tampil; mencoba FLUX.2 Klein dengan master reference."
              http_status=$(curl --silent --show-error --output cloudflare-response.json --write-out "%{http_code}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-2-klein-4b" \
                -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -F "prompt=${prompt}" -F "input_image_0=@raka-reference-512.jpg;type=image/jpeg" || true)
              image_base64=$(jq -r '.result.image // .image // empty' cloudflare-response.json 2>/dev/null || true)

              if [ "$http_status" != "200" ] || [ -z "$image_base64" ]; then
                echo "RETRY: Scene $scene_label ditolak/gagal dengan reference. Mencoba FLUX.2 Klein tanpa reference."
                fallback_prompt="Vertical 9:16 2D anime-inspired historical documentary illustration. Include the recurring modern presenter Raka: youthful Indonesian man, warm medium-tan skin, large brown eyes, thick tousled black hair, tan-brown explorer jacket, black shirt and compass pendant. Expression: $expression. Gesture: $action. Historical setting: $setting. Keep location continuity: $continuity. Background: $background. Visual scene: $visual. Historically grounded clothing, architecture and landscape. Warm cinematic light, clear composition, no text, no watermark."
                fallback_prompt=$(printf '%s' "$fallback_prompt" | cut -c1-1800)
                request=$(jq -n --arg prompt "$fallback_prompt" '{prompt:$prompt,steps:4}')
                http_status=$(curl --silent --show-error --output cloudflare-response.json --write-out "%{http_code}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-2-klein-4b" \
                  -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" -d "$request" || true)
                image_base64=$(jq -r '.result.image // .image // empty' cloudflare-response.json 2>/dev/null || true)
              fi

              if [ "$http_status" != "200" ] || [ -z "$image_base64" ]; then
                echo "FALLBACK: Scene $scene_label mencoba FLUX Schnell tanpa reference, Raka tetap diminta dalam prompt."
                request=$(jq -n --arg prompt "$fallback_prompt" '{prompt:$prompt,steps:4}')
                http_status=$(curl --silent --show-error --output cloudflare-response.json --write-out "%{http_code}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell" \
                  -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" -d "$request" || true)
                image_base64=$(jq -r '.result.image // .image // empty' cloudflare-response.json 2>/dev/null || true)
              fi
            else
              full_prompt="Create a vertical 2D anime-inspired historical documentary illustration with NO presenter, NO modern person, and NO Raka character. Focus entirely on the historical event and its people, location, artifacts, maps, or process. HISTORICAL SETTING: $setting. LOCATION CONTINUITY: $continuity. Show only the correct civilization, architecture, clothing, landscape and period. Background activity: $background. Scene: $visual. Historically accurate, cinematic warm lighting, clear composition. No text, captions or watermark."
              prompt=$(printf '%s' "$full_prompt" | cut -c1-1950)
              echo "Scene $scene_label: tanpa Raka; mencoba FLUX Schnell."
              request=$(jq -n --arg prompt "$prompt" '{prompt:$prompt,steps:4}')
              http_status=$(curl --silent --show-error --output cloudflare-response.json --write-out "%{http_code}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell" \
                -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" -d "$request" || true)
              image_base64=$(jq -r '.result.image // .image // empty' cloudflare-response.json 2>/dev/null || true)

              if [ "$http_status" != "200" ] || [ -z "$image_base64" ]; then
                echo "RETRY: Scene $scene_label mencoba prompt sejarah yang disederhanakan."
                fallback_prompt="Vertical 9:16 2D anime historical illustration. No modern people and no presenter. Show this Ancient Egyptian scene: $setting. $background. $visual. Historically appropriate clothing, tools and architecture, warm natural light, clear composition, no text, no watermark."
                fallback_prompt=$(printf '%s' "$fallback_prompt" | cut -c1-1500)
                request=$(jq -n --arg prompt "$fallback_prompt" '{prompt:$prompt,steps:4}')
                http_status=$(curl --silent --show-error --output cloudflare-response.json --write-out "%{http_code}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell" \
                  -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" -d "$request" || true)
                image_base64=$(jq -r '.result.image // .image // empty' cloudflare-response.json 2>/dev/null || true)
              fi
            fi

            if [ "$http_status" != "200" ] || [ -z "$image_base64" ]; then
              echo "ERROR: Semua percobaan gambar gagal pada scene $scene_label. Respons terakhir:"
              jq . cloudflare-response.json 2>/dev/null || head -c 3000 cloudflare-response.json
              exit 1
            fi

            response=$(cat cloudflare-response.json)
            image_base64=$(printf '%s' "$response" | jq -r '.result.image // .image // empty')
            [ -n "$image_base64" ] || {
              echo "ERROR: Respons tidak berisi gambar scene $scene_label."
              printf '%s' "$response" | jq '{success,errors,messages}'
              exit 1
            }

            image_file="scene-${scene_label}.jpg"
            printf '%s' "$image_base64" | base64 --decode > "output/$image_file"
            [ -s "output/$image_file" ] || { echo "ERROR: Gambar $image_file kosong."; exit 1; }

            object_path="raka/news-reference-scenes/${script_id}/$image_file"
            curl --fail-with-body --silent --show-error -X POST               "${SUPABASE_URL}/storage/v1/object/visual-assets/$object_path"               -H "apikey: ${SUPABASE_SECRET_KEY}"               -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}"               -H "Content-Type: image/jpeg" -H "x-upsert: true"               --data-binary @"output/$image_file" >/dev/null

            echo "BERHASIL: $image_file tersimpan."
          done

          echo "SELESAI: Semua gambar dengan referensi Raka selesai."
          echo "Lokasi: visual-assets/raka/news-reference-scenes/${script_id}/"
          ls -lh output/
