name: Generate Peta Sunyi image-to-video clips (review only)

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode config filename without .json"
        required: true
        type: string
      confirm_generation:
        description: "Must be true to submit jobs and consume free ZeroGPU quota"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: peta-sunyi-hf-i2v
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plan and guardrails (no GPU calls)
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python scripts/peta-sunyi/generate_i2v.py \
            --episode-config "episodes/peta-sunyi/${{ inputs.episode_id }}.json" \
            --plan-only
          python -m py_compile scripts/peta-sunyi/generate_i2v.py scripts/peta-sunyi/hf_i2v_provider.py
          python -m unittest discover -s tests -p 'test_peta_sunyi_i2v_guardrails.py'

  generate:
    if: ${{ inputs.confirm_generation == true }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider clients
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests huggingface_hub gradio_client
      - name: Generate and upload at most three clips
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_I2V_SPACE_ID: ${{ vars.HF_I2V_SPACE_ID }}
          HF_I2V_API_NAME: ${{ vars.HF_I2V_API_NAME }}
          HF_I2V_IMAGE_PARAM: ${{ vars.HF_I2V_IMAGE_PARAM }}
          HF_I2V_PROMPT_PARAM: ${{ vars.HF_I2V_PROMPT_PARAM }}
          HF_I2V_NEGATIVE_PROMPT_PARAM: ${{ vars.HF_I2V_NEGATIVE_PROMPT_PARAM }}
          HF_I2V_RESERVE_GPU_SECONDS: "60"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret missing"; exit 1; }
          test -n "$HF_I2V_SPACE_ID" || { echo "HF_I2V_SPACE_ID variable missing; provider not configured"; exit 1; }
          test -n "$HF_I2V_API_NAME" || { echo "HF_I2V_API_NAME variable missing; inspect the Space API first"; exit 1; }
          python scripts/peta-sunyi/generate_i2v.py \
            --episode-config "episodes/peta-sunyi/${{ inputs.episode_id }}.json" \
            --execute
