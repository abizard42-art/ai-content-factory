name: Clipping Factory - URL Intake

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL YouTube podcast/video yang ingin diproses"
        required: true
        type: string
      permission_confirmed:
        description: "Saya memiliki izin/hak untuk mengolah video ini"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  receive-video-url:
    runs-on: ubuntu-latest
    steps:
      - name: Validate URL and prepare intake record
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          PERMISSION_CONFIRMED: ${{ inputs.permission_confirmed }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse, parse_qs

          raw = os.environ.get("VIDEO_URL", "").strip()
          permission = os.environ.get("PERMISSION_CONFIRMED", "").lower() == "true"

          if not permission:
              raise SystemExit(
                  "STOP: Konfirmasi izin/hak pengolahan video harus dicentang sebelum diproses."
              )

          if not raw:
              raise SystemExit("ERROR: URL video masih kosong.")

          candidate = raw if "://" in raw else "https://" + raw
          parsed = urlparse(candidate)
          host = (parsed.hostname or "").lower()
          allowed_hosts = {"youtube.com", "www.youtube.com", "m.youtube.com", "youtu.be", "www.youtu.be"}

          if parsed.scheme != "https" or host not in allowed_hosts:
              raise SystemExit("ERROR: Masukkan URL YouTube HTTPS yang valid.")

          video_id = None
          if host.endswith("youtu.be"):
              video_id = parsed.path.strip("/").split("/")[0]
          elif parsed.path == "/watch":
              video_id = parse_qs(parsed.query).get("v", [None])[0]
          else:
              match = re.match(r"^/(?:shorts|live|embed)/([A-Za-z0-9_-]{6,})", parsed.path)
              if match:
                  video_id = match.group(1)

          if not video_id or not re.fullmatch(r"[A-Za-z0-9_-]{6,}", video_id):
              raise SystemExit("ERROR: ID video tidak ditemukan. Periksa kembali URL YouTube.")

          record = {
              "engine": "podcast_clip_engine",
              "stage": "url_received",
              "video_id": video_id,
              "source_url": f"https://www.youtube.com/watch?v={video_id}",
              "permission_confirmed": True,
              "media_downloaded": False,
              "next_stage": "authorized_media_access_and_transcription"
          }

          os.makedirs("intake", exist_ok=True)
          with open("intake/video-intake.json", "w", encoding="utf-8") as f:
              json.dump(record, f, ensure_ascii=False, indent=2)

          print("URL YouTube berhasil diterima dan divalidasi.")
          print(f"Video ID: {video_id}")
          print("Status: menunggu tahap akses media dan transkripsi.")
          PY

      - name: Upload intake record
        uses: actions/upload-artifact@v4
        with:
          name: clipping-video-intake
          path: intake/video-intake.json
          if-no-files-found: error
          retention-days: 7
