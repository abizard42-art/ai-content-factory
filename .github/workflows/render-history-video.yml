name: Render history video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl bc

      - name: Set up Python for alignment and ambient effects
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forced-alignment and ambient engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install whisperx pillow

      - name: Check out ambient renderer
        uses: actions/checkout@v4

      - name: Download scenes, render MP4, and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          for name in SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name belum diisi."
              exit 1
            fi
          done

          echo "Mencari channel Sejarah Dunia..."
          channel_result=$(curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/channels?name=eq.Sejarah%20Dunia&select=id&limit=1" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}")
          channel_id=$(printf '%s' "$channel_result" | jq -r '.[0].id // empty')
          if [ -z "$channel_id" ]; then
            echo "ERROR: Channel Sejarah Dunia tidak ditemukan."
            exit 1
          fi

          topics_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/topics" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "channel_id=eq.$channel_id" \
            --data-urlencode "select=id,title" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1")
          topic_id=$(printf '%s' "$topics_result" | jq -r '.[0].id // empty')
          topic_title=$(printf '%s' "$topics_result" | jq -r '.[0].title // "Sejarah Dunia"')
          if [ -z "$topic_id" ]; then
            echo "ERROR: Belum ada topik."
            exit 1
          fi

          scripts_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/scripts" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "topic_id=eq.$topic_id" \
            --data-urlencode "select=id,body,storyboard" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1")
          script_id=$(printf '%s' "$scripts_result" | jq -r '.[0].id // empty')
          script_body=$(printf '%s' "$scripts_result" | jq -r '.[0].body // empty')
          storyboard=$(printf '%s' "$scripts_result" | jq -c '.[0].storyboard // empty')
          if [ -z "$script_id" ] || [ -z "$script_body" ] || [ "$storyboard" = "null" ] || [ -z "$storyboard" ]; then
            echo "ERROR: Script, isi naskah, atau storyboard tidak ditemukan."
            exit 1
          fi

          scene_count=$(printf '%s' "$storyboard" | jq 'if type == "array" then length else 0 end')
          if [ "$scene_count" -lt 1 ]; then
            echo "ERROR: Storyboard kosong."
            exit 1
          fi

          # Ambil narasi untuk script yang sama agar suara dan gambar tidak tertukar.
          audio_path="raka/audio/${script_id}/narration.wav"
          echo "Mengunduh narasi Raka..."
          audio_status=$(curl --silent --show-error --output narration.wav --write-out "%{http_code}" \
            "${SUPABASE_URL}/storage/v1/object/visual-assets/${audio_path}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" || true)
          if [ "$audio_status" != "200" ] || [ ! -s narration.wav ]; then
            echo "ERROR: Narasi untuk script ini belum tersedia (HTTP $audio_status)."
            echo "Jalankan workflow Generate Raka narration terlebih dahulu, lalu ulangi render."
            exit 1
          fi

          mkdir -p scenes clips
          echo "Topik: $topic_title"
          echo "Script ID: $script_id"
          echo "Jumlah scene: $scene_count"

          total_seconds=0
          for ((i=0; i<scene_count; i++)); do
            scene_number=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].scene // ($i + 1)')
            duration=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '(.[$i].duration_seconds // .[$i].duration // 8) | if type == "number" then . else (tonumber? // 8) end')
            if ! [[ "$duration" =~ ^[0-9]+([.][0-9]+)?$ ]]; then duration=8; fi
            if (( $(echo "$duration < 2" | bc -l) )); then duration=2; fi
            printf -v scene_label "%02d" "$scene_number"
            image_file="scene-${scene_label}.jpg"
            object_path="raka/news-reference-scenes/${script_id}/${image_file}"

            echo "Mengunduh $image_file..."
            curl --fail-with-body --silent --show-error \
              "${SUPABASE_URL}/storage/v1/object/visual-assets/${object_path}" \
              -H "apikey: ${SUPABASE_SECRET_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
              -o "scenes/$image_file"

            if [ ! -s "scenes/$image_file" ]; then
              echo "ERROR: $image_file tidak ditemukan atau kosong."
              exit 1
            fi

            frames=$(awk -v d="$duration" 'BEGIN { printf "%d", d * 24 }')
            echo "Merender scene $scene_label selama ${duration} detik..."
            scene_context=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '[.[$i].historical_setting // "", .[$i].background_action // "", .[$i].visual_prompt // "", .[$i].narration // ""] | join(" ")')
            mkdir -p "ambient/scene-$scene_label" "ambient-audio"
            python3 scripts/ambient_engine.py --context "$scene_context" --duration "$duration" --out "ambient/scene-$scene_label"
            mkdir -p "background-motion/scene-$scene_label"
            python3 scripts/background_motion.py --context "$scene_context" --duration "$duration" --out "background-motion/scene-$scene_label"
            mkdir -p "parallax/scene-$scene_label"
            python3 scripts/parallax_engine.py --input "scenes/$image_file" --duration "$duration" --out "parallax/scene-$scene_label"
            ffmpeg -hide_banner -loglevel error -y \
              -framerate 12 -i "parallax/scene-$scene_label/%05d.png" \
              -framerate 12 -i "ambient/scene-$scene_label/%05d.png" \
              -framerate 12 -i "background-motion/scene-$scene_label/%05d.png" \
              -filter_complex "[0:v]fps=24,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z='min(zoom+0.00045,1.06)':d=1:s=720x1280:fps=24,setsar=1[base];[1:v]format=rgba,fps=24[fx];[base][fx]overlay=shortest=1:format=auto[ambient];[2:v]format=rgba,fps=24[light];[ambient][light]overlay=shortest=1:format=auto,format=yuv420p[outv]" \
              -map "[outv]" -frames:v "$frames" -an -c:v libx264 -preset veryfast -crf 23 \
              "clips/clip-$scene_label.mp4"

            ambient_kind=$(python3 -c 'import sys; t=sys.argv[1].lower(); rules=[(("desert","gurun","sand","pasir","egypt","giza"),"desert"),(("arctic","antarctic","kutub","glacier","ice","es","snow","salju"),"cold"),(("rain","hujan","storm","badai"),"rain"),(("underwater","ocean","sea","laut","samudra"),"underwater"),(("volcano","lava","gunung berapi","fire","flame","api"),"fire"),(("forest","jungle","hutan","rainforest"),"forest")]; print(next((v for keys,v in rules if any(k in t for k in keys)),"none"))' "$scene_context")
            case "$ambient_kind" in
              desert) noise_filter="lowpass=f=850,highpass=f=90,volume=0.10" ;;
              cold) noise_filter="highpass=f=500,lowpass=f=4200,volume=0.075" ;;
              rain) noise_filter="highpass=f=650,lowpass=f=6500,volume=0.065" ;;
              underwater) noise_filter="lowpass=f=480,volume=0.075" ;;
              fire) noise_filter="lowpass=f=1400,volume=0.055" ;;
              forest) noise_filter="highpass=f=250,lowpass=f=2600,volume=0.045" ;;
              *) noise_filter="volume=0" ;;
            esac
            fade_start=$(awk -v d="$duration" 'BEGIN{v=d-0.6;if(v<0)v=0;print v}')
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.35:sample_rate=24000:duration=$duration" -af "$noise_filter,afade=t=in:d=0.6,afade=t=out:st=$fade_start:d=0.6" -ac 1 -ar 24000 "ambient-audio/ambient-$scene_label.wav"
            printf "file '%s'\n" "clip-$scene_label.mp4" >> clips/concat.txt
            printf "file '%s'\n" "ambient-$scene_label.wav" >> ambient-audio/concat.txt
            total_seconds=$(awk -v a="$total_seconds" -v b="$duration" 'BEGIN { print a+b }')
          done

          echo "Menggabungkan semua scene..."
          cd clips
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy -movflags +faststart \
            "../history-${script_id}.mp4"
          cd ..

          # Gabungkan suara narator dengan video; durasi akhir mengikuti target storyboard.
          silent_video="silent-history-${script_id}.mp4"
          mv "history-${script_id}.mp4" "$silent_video"
          echo "Menggabungkan narasi Raka dengan video..."
          ffmpeg -hide_banner -loglevel error -y \
            -i "$silent_video" -i narration.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 128k \
            -af "apad" -t "$total_seconds" -movflags +faststart \
            "history-${script_id}.mp4"

          video_file="history-${script_id}.mp4"

          # Gabungkan ambience kontekstual secara halus di bawah narasi Raka.
          echo "Menggabungkan ambient audio sesuai kondisi tiap scene..."
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i ambient-audio/concat.txt -c:a pcm_s16le ambient-bed.wav
          ffmpeg -hide_banner -loglevel error -y -i "$video_file" -i ambient-bed.wav -filter_complex "[0:a]volume=1.0[voice];[1:a]volume=0.65[amb];[voice][amb]amix=inputs=2:duration=first:dropout_transition=2:normalize=0[mix]" -map 0:v:0 -map "[mix]" -c:v copy -c:a aac -b:a 160k -movflags +faststart "mixed-$video_file"
          mv "mixed-$video_file" "$video_file"

          # Pakai forced alignment bahasa Indonesia untuk timestamp asli setiap kata.
          echo "Mencocokkan naskah dengan audio Raka (word-level forced alignment)..."
          SCRIPT_BODY="$script_body" python3 - <<'PY'
          import os
          import re
          import textwrap
          import whisperx

          transcript = re.sub(r"\s+", " ", os.environ["SCRIPT_BODY"]).strip()
          if not transcript:
              raise SystemExit("ERROR: Naskah untuk alignment kosong.")

          print("Memuat audio Raka...")
          audio = whisperx.load_audio("narration.wav")
          audio_duration = len(audio) / 16000.0

          print("Memuat model alignment bahasa Indonesia...")
          model, metadata = whisperx.load_align_model(
              language_code="id",
              device="cpu",
              model_name="cahya/wav2vec2-large-xlsr-indonesian",
          )

          print("Menyelaraskan setiap kata dengan audio...")
          aligned = whisperx.align(
              [{"start": 0.0, "end": audio_duration, "text": transcript}],
              model,
              metadata,
              audio,
              device="cpu",
              return_char_alignments=False,
          )

          words = aligned.get("word_segments", [])
          expected_words = len(transcript.split())
          if not words:
              raise SystemExit("ERROR: Forced alignment tidak menghasilkan timestamp kata.")
          coverage = len(words) / max(1, expected_words)
          print(f"Kata naskah: {expected_words}; kata bertimestamp: {len(words)}; cakupan: {coverage:.0%}")
          if coverage < 0.80:
              raise SystemExit("ERROR: Cakupan alignment di bawah 80%; subtitle tidak dibuat agar timing tidak menyesatkan.")

          def ass_time(seconds):
              total = max(0, round(seconds * 100))
              hours, rem = divmod(total, 360000)
              minutes, rem = divmod(rem, 6000)
              secs, centis = divmod(rem, 100)
              return f"{hours}:{minutes:02}:{secs:02}.{centis:02}"

          def ass_escape(value):
              return str(value).replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          # Maksimal 5 kata per cue. Jeda alami lebih dari 0,65 detik memulai cue baru.
          chunks = []
          current = []
          for item in words:
              if item.get("start") is None or item.get("end") is None:
                  continue
              word = str(item.get("word", "")).strip()
              if not word:
                  continue
              current_item = {
                  "word": word,
                  "start": float(item["start"]),
                  "end": float(item["end"]),
              }
              if current and (
                  len(current) >= 5
                  or current_item["start"] - current[-1]["end"] > 0.65
              ):
                  chunks.append(current)
                  current = []
              current.append(current_item)
          if current:
              chunks.append(current)

          events = []
          for chunk in chunks:
              cue_start = chunk[0]["start"]
              cue_end = chunk[-1]["end"]
              if cue_end <= cue_start:
                  continue
              tags = []
              for index, item in enumerate(chunk):
                  if index + 1 < len(chunk):
                      next_start = chunk[index + 1]["start"]
                      word_duration = max(0.01, next_start - item["start"])
                  else:
                      word_duration = max(0.01, item["end"] - item["start"])
                  centis = max(1, round(word_duration * 100))
                  tags.append(f"{{\\kf{centis}}}{ass_escape(item['word'])}")
              text = " ".join(tags)
              events.append(
                  f"Dialogue: 0,{ass_time(cue_start)},{ass_time(cue_end)},Karaoke,,0,0,0,,{text}"
              )

          if not events:
              raise SystemExit("ERROR: Tidak ada cue subtitle yang valid.")

          header = textwrap.dedent("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 720
          PlayResY: 1280
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Karaoke,DejaVu Sans,24,&H0000D7FF,&H00FFFFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,2,1,2,45,45,105,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)
          with open("captions.ass", "w", encoding="utf-8") as f:
              f.write(header)
              f.write("\n".join(events) + "\n")

          print(f"Subtitle karaoke presisi dibuat: {len(events)} cue, maksimal 5 kata per cue.")
          print("Timestamp berasal dari audio Raka, bukan perkiraan panjang kata.")
          PY

          # Burn-in subtitle karaoke; sorotan mengikuti timestamp ucapan asli.
          echo "Menambahkan subtitle karaoke ke video..."
          ffmpeg -hide_banner -loglevel error -y -i "$video_file" -vf "ass=captions.ass" -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -c:a copy -movflags +faststart "captioned-$video_file"
          mv "captioned-$video_file" "$video_file"

          video_file="history-${script_id}.mp4"
          if [ ! -s "$video_file" ]; then
            echo "ERROR: File MP4 tidak berhasil dibuat."
            exit 1
          fi

          echo "Mengunggah video ke Supabase Storage..."
          object_path="raka/videos/${script_id}/history-${script_id}.mp4"
          curl --fail-with-body --silent --show-error \
            -X POST "${SUPABASE_URL}/storage/v1/object/visual-assets/${object_path}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @"$video_file"

          echo "========================================"
          echo "BERHASIL: Video MP4 selesai dibuat."
          echo "Judul/topik: $topic_title"
          echo "Jumlah scene: $scene_count"
          echo "Durasi target gabungan: ${total_seconds} detik"
          echo "Lokasi: visual-assets/$object_path"
          ls -lh "$video_file"
