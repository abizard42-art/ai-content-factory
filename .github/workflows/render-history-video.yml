name: Render history video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl bc

      - name: Download scenes, render MP4, and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          for name in SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name belum diisi."
              exit 1
            fi
          done

          echo "Mencari channel Sejarah Dunia..."
          channel_result=$(curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/channels?name=eq.Sejarah%20Dunia&select=id&limit=1" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}")
          channel_id=$(printf '%s' "$channel_result" | jq -r '.[0].id // empty')
          if [ -z "$channel_id" ]; then
            echo "ERROR: Channel Sejarah Dunia tidak ditemukan."
            exit 1
          fi

          topics_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/topics" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "channel_id=eq.$channel_id" \
            --data-urlencode "select=id,title" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1")
          topic_id=$(printf '%s' "$topics_result" | jq -r '.[0].id // empty')
          topic_title=$(printf '%s' "$topics_result" | jq -r '.[0].title // "Sejarah Dunia"')
          if [ -z "$topic_id" ]; then
            echo "ERROR: Belum ada topik."
            exit 1
          fi

          scripts_result=$(curl --fail-with-body --silent --show-error --get \
            "${SUPABASE_URL}/rest/v1/scripts" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --data-urlencode "topic_id=eq.$topic_id" \
            --data-urlencode "select=id,body,storyboard" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1")
          script_id=$(printf '%s' "$scripts_result" | jq -r '.[0].id // empty')
          storyboard=$(printf '%s' "$scripts_result" | jq -c '.[0].storyboard // empty')
          if [ -z "$script_id" ] || [ "$storyboard" = "null" ] || [ -z "$storyboard" ]; then
            echo "ERROR: Script atau storyboard tidak ditemukan."
            exit 1
          fi

          scene_count=$(printf '%s' "$storyboard" | jq 'if type == "array" then length else 0 end')
          if [ "$scene_count" -lt 1 ]; then
            echo "ERROR: Storyboard kosong."
            exit 1
          fi

          # Ambil narasi untuk script yang sama agar suara dan gambar tidak tertukar.
          audio_path="raka/audio/${script_id}/narration.wav"
          echo "Mengunduh narasi Raka..."
          audio_status=$(curl --silent --show-error --output narration.wav --write-out "%{http_code}" \
            "${SUPABASE_URL}/storage/v1/object/visual-assets/${audio_path}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" || true)
          if [ "$audio_status" != "200" ] || [ ! -s narration.wav ]; then
            echo "ERROR: Narasi untuk script ini belum tersedia (HTTP $audio_status)."
            echo "Jalankan workflow Generate Raka narration terlebih dahulu, lalu ulangi render."
            exit 1
          fi

          mkdir -p scenes clips
          echo "Topik: $topic_title"
          echo "Script ID: $script_id"
          echo "Jumlah scene: $scene_count"

          total_seconds=0
          for ((i=0; i<scene_count; i++)); do
            scene_number=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '.[$i].scene // ($i + 1)')
            duration=$(printf '%s' "$storyboard" | jq -r --argjson i "$i" '(.[$i].duration_seconds // .[$i].duration // 8) | if type == "number" then . else (tonumber? // 8) end')
            if ! [[ "$duration" =~ ^[0-9]+([.][0-9]+)?$ ]]; then duration=8; fi
            if (( $(echo "$duration < 2" | bc -l) )); then duration=2; fi
            printf -v scene_label "%02d" "$scene_number"
            image_file="scene-${scene_label}.jpg"
            object_path="raka/news-reference-scenes/${script_id}/${image_file}"

            echo "Mengunduh $image_file..."
            curl --fail-with-body --silent --show-error \
              "${SUPABASE_URL}/storage/v1/object/visual-assets/${object_path}" \
              -H "apikey: ${SUPABASE_SECRET_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
              -o "scenes/$image_file"

            if [ ! -s "scenes/$image_file" ]; then
              echo "ERROR: $image_file tidak ditemukan atau kosong."
              exit 1
            fi

            frames=$(awk -v d="$duration" 'BEGIN { printf "%d", d * 24 }')
            echo "Merender scene $scene_label selama ${duration} detik..."
            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 24 -i "scenes/$image_file" \
              -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z='min(zoom+0.00045,1.06)':d=1:s=720x1280:fps=24,setsar=1" \
              -frames:v "$frames" -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              "clips/clip-${scene_label}.mp4"

            printf "file '%s'\n" "clip-${scene_label}.mp4" >> clips/concat.txt
            total_seconds=$(awk -v a="$total_seconds" -v b="$duration" 'BEGIN { print a+b }')
          done

          echo "Menggabungkan semua scene..."
          cd clips
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy -movflags +faststart \
            "../history-${script_id}.mp4"
          cd ..

          # Gabungkan suara narator dengan video; durasi akhir mengikuti target storyboard.
          silent_video="silent-history-${script_id}.mp4"
          mv "history-${script_id}.mp4" "$silent_video"
          echo "Menggabungkan narasi Raka dengan video..."
          ffmpeg -hide_banner -loglevel error -y \
            -i "$silent_video" -i narration.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 128k \
            -af "apad" -t "$total_seconds" -movflags +faststart \
            "history-${script_id}.mp4"

          video_file="history-${script_id}.mp4"

          # Buat subtitle karaoke: maksimal 5 kata per layar, kata aktif disorot.
          printf '%s' "$storyboard" > storyboard.json
          python3 - <<'PY'
          import json
          import re
          import textwrap

          with open("storyboard.json", encoding="utf-8") as f:
              scenes = json.load(f)

          def ass_time(seconds):
              total = max(0, round(seconds * 100))
              hours, rem = divmod(total, 360000)
              minutes, centis = divmod(rem, 6000)
              secs, centis = divmod(centis, 100)
              return f"{hours}:{minutes:02}:{secs:02}.{centis:02}"

          def ass_escape(word):
              return word.replace("{", "\\{").replace("}", "\\}")

          events = []
          cursor = 0.0
          for scene in scenes:
              duration = float(scene.get("duration_seconds", scene.get("duration", 8)) or 8)
              narration = str(scene.get("narration", "")).strip()
              words = re.findall(r"\S+", narration)
              if words:
                  chunks = [words[i:i+5] for i in range(0, len(words), 5)]
                  weights = [sum(max(1, len(w)) for w in chunk) for chunk in chunks]
                  total_weight = sum(weights) or 1
                  chunk_start = cursor
                  for chunk, weight in zip(chunks, weights):
                      chunk_duration = duration * weight / total_weight
                      chunk_end = chunk_start + chunk_duration
                      word_weights = [max(1, len(w)) for w in chunk]
                      total_word_weight = sum(word_weights) or 1
                      tags = []
                      for word, word_weight in zip(chunk, word_weights):
                          centis = max(1, round(chunk_duration * word_weight / total_word_weight * 100))
                          tags.append(f"{{\\kf{centis}}}{ass_escape(word)}")
                      text = " ".join(tags)
                      events.append(
                          f"Dialogue: 0,{ass_time(chunk_start)},{ass_time(chunk_end)},Karaoke,,0,0,0,,{text}"
                      )
                      chunk_start = chunk_end
              cursor += duration

          if not events:
              raise SystemExit("ERROR: Tidak ada narration pada storyboard untuk subtitle.")

          header = textwrap.dedent("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 720
          PlayResY: 1280
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Karaoke,DejaVu Sans,28,&H0000D7FF,&H00FFFFFF,&H00101010,&H80000000,1,0,0,0,100,100,0,0,1,2,1,2,35,35,105,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)
          with open("captions.ass", "w", encoding="utf-8") as f:
              f.write(header)
              f.write("\n".join(events) + "\n")
          print(f"Subtitle karaoke dibuat: {len(events)} cue, maksimal 5 kata per cue.")
          PY

          # Burn-in subtitle karaoke; kata yang sedang dibaca disorot kuning.
          echo "Menambahkan subtitle karaoke ke video..."
          ffmpeg -hide_banner -loglevel error -y \\
            -i "$video_file" \\
            -vf "ass=captions.ass" \\
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \\
            -c:a copy -movflags +faststart \\
            "captioned-$video_file"
          mv "captioned-$video_file" "$video_file"

          video_file="history-${script_id}.mp4"
          if [ ! -s "$video_file" ]; then
            echo "ERROR: File MP4 tidak berhasil dibuat."
            exit 1
          fi

          echo "Mengunggah video ke Supabase Storage..."
          object_path="raka/videos/${script_id}/history-${script_id}.mp4"
          curl --fail-with-body --silent --show-error \
            -X POST "${SUPABASE_URL}/storage/v1/object/visual-assets/${object_path}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @"$video_file"

          echo "========================================"
          echo "BERHASIL: Video MP4 selesai dibuat."
          echo "Judul/topik: $topic_title"
          echo "Jumlah scene: $scene_count"
          echo "Durasi target gabungan: ${total_seconds} detik"
          echo "Lokasi: visual-assets/$object_path"
          ls -lh "$video_file"
