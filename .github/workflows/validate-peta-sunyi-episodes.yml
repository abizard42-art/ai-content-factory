name: Validate Peta Sunyi episode package

on:
  pull_request:
    paths:
      - "episodes/peta-sunyi/**"
      - "assets/peta-sunyi/**"
      - "scripts/peta-sunyi/**"
      - ".github/workflows/*peta-sunyi*"
      - "storyboards/peta-sunyi/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python, JSON and episode asset references
        run: |
          set -euo pipefail
          python -m py_compile scripts/peta-sunyi/render_episode.py
          python -m py_compile scripts/peta-sunyi/humanize_narration.py
          python -m unittest discover -s tests -p 'test_peta_sunyi_humanizer.py'
          python - <<'PY'
          import json, pathlib
          expected_scenes = {
              "teaser-lembang-camping": 5,
              "rumah-iblis-bogor-ep1": 5,
              "rumah-iblis-bogor-ep2": 5,
              "rumah-iblis-bogor-ep3": 5,
              "observatorium-bosscha-lembang": 8,
              "penjara-banceuy-bandung": 8,
              "long-horror-lembang-camping": 10,
          }
          for config_path in pathlib.Path("episodes/peta-sunyi").glob("*.json"):
              config=json.loads(config_path.read_text(encoding="utf-8"))
              slug=config["episode_id"]
              manifest_path=pathlib.Path("assets/peta-sunyi")/slug/"asset-manifest.json"
              manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest_ids={item["id"] for item in manifest["assets"]}
              missing=sorted({scene["shot"] for scene in config["scenes"] if scene.get("kind", "ai")=="ai"}-manifest_ids)
              if missing:
                  raise SystemExit(f"{slug}: missing AI asset IDs: {missing}")
              expected=expected_scenes.get(slug, 9)
              if len(config["scenes"]) != expected:
                  raise SystemExit(f"{slug}: expected {expected} scenes, got {len(config['scenes'])}")
              print(f"EPISODE_CONFIG_OK={slug}; scenes={len(config['scenes'])}; assets={len(manifest_ids)}")
          PY
      - name: Validate workflow YAML syntax
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".github/workflows").glob("*peta-sunyi*"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"WORKFLOW_YAML_OK={path}")
          PY
