name: Generate Peta Sunyi script

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Kisah atau tempat misteri yang ingin diteliti"
        required: true
        default: "Misteri Rumah Kentang Bandung: asal-usul legenda dan fakta yang bisa diverifikasi"
        type: string

permissions:
  contents: read

jobs:
  generate-mystery-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate researched mystery package and save to Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail

          for name in GEMINI_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name belum diisi."
              exit 1
            fi
          done

          cat > mystery-channel-config.json <<'CONFIG'
          {
            "slug": "peta-sunyi",
            "name": "Peta Sunyi",
            "language": "id-ID",
            "format": "youtube_shorts",
            "target_videos_per_day": 2,
            "target_duration_seconds": { "min": 60, "max": 90 },
            "initial_region": "Bandung, Jawa Barat, Indonesia",
            "expansion_region": "Indonesia",
            "visual_style": "hybrid",
            "visual_mix": [
              "real_location_photo",
              "ai_folklore_reconstruction",
              "map_or_historical_document"
            ],
            "editorial_rules": {
              "separate_fact_legend_and_unverified_claims": true,
              "never_present_supernatural_claims_as_proven_facts": true,
              "require_source_urls_for_historical_and_location_claims": true,
              "respect_image_licenses_and_attribution": true,
              "human_review_before_publish": true
            },
            "narration": {
              "language": "Indonesian",
              "tone": "calm, suspenseful, documentary, not sensationalist",
              "voice_identity": "consistent_mystery_narrator"
            },
            "publishing": {
              "auto_upload_enabled": false,
              "approval_required": true
            }
          }
          CONFIG

          python - <<'PY'
          import json, os, re, sys, time, random, urllib.request, urllib.error

          config = json.load(open("mystery-channel-config.json", encoding="utf-8"))
          topic = os.environ["TOPIC"].strip()
          if not topic:
              raise SystemExit("Topik tidak boleh kosong.")

          prompt = f"""
          Kamu adalah peneliti sejarah dan penulis dokumenter misteri Indonesia untuk channel
          "{config['name']}". Buat SATU paket YouTube Shorts berdurasi 60–90 detik
          tentang topik berikut: {topic}

          ATURAN RISET & EDITORIAL:
          - Bahasa Indonesia alami, atmosferik, kuat, akurat, dan tidak bertele-tele.
          - Utamakan fakta sejarah dan lokasi yang dapat diverifikasi.
          - Pisahkan FAKTA TERVERIFIKASI, LEGENDA/KLAIM, dan INFORMASI YANG BELUM TERVERIFIKASI.
          - Jangan menciptakan saksi, kutipan, tanggal, nama, fungsi bangunan, koordinat, atau peristiwa.
          - Jangan menyebut rumor sebagai fakta atau mengarang cerita paranormal.
          - Jika sumber atau detail tidak pasti, nyatakan keterbatasannya secara eksplisit.
          - Tahap ini tidak memiliki Google Search grounding. Jangan mengaku telah melakukan pencarian web.
          - Sertakan URL hanya jika benar-benar diketahui dan dapat dipastikan; jangan mengarang URL.
          - Jika sumber primer/tepercaya tidak dapat dipastikan, gunakan source_urls: [] dan set
            fact_check_status menjadi "insufficient_sources".
          - Prioritaskan sumber resmi pengelola/institusi, arsip, jurnal akademik, museum,
            pemerintah, dan media kredibel. Catat judul/nama sumber dan klaim yang didukung.
          - Rekonstruksi AI bukan foto dokumentasi dan wajib diberi label "REKA ADEGAN • ILUSTRASI AI".

          ARAHAN KHUSUS TOPIK:
          - Untuk Penjara Banceuy: verifikasi sejarah penjara, lokasi dan sisa bangunan,
            masa penahanan Soekarno, kronologi 1929, serta detail kondisi sel dari sumber tepercaya.
            Jangan menambahkan detail pengalaman pribadi Soekarno yang tidak didukung sumber.
          - Untuk Observatorium Bosscha: verifikasi sejarah pembangunan/peresmian, tokoh pendiri,
            fungsi observatorium, instrumen/teleskop, dan kondisi pada masa pendudukan Jepang.
            Jangan menyebut Bosscha sebagai lokasi angker atau mengklaim kejadian paranormal.
          - Jika topik lain diberikan, riset topik itu secara netral tanpa membawa fakta dari topik lain.

          STRUKTUR CERITA:
          1. Hook kuat dalam 0–3 detik.
          2. Kenalkan lokasi dan konteks sejarah.
          3. Bangun rasa ingin tahu melalui detail konkret, bukan klaim sensasional.
          4. Jelaskan fakta utama dengan kronologi yang mudah dipahami.
          5. Pisahkan legenda/interpretasi dari fakta bila relevan.
          6. Tutup dengan kalimat berkesan dan pertanyaan untuk penonton.

          VISUAL HYBRID:
          Buat 8–10 scene vertikal 9:16. Variasikan:
          - Dokumentasi lokasi/arsip hanya sebagai referensi; catat URL sumber dan status izin.
          - Rekonstruksi AI sinematik untuk menggambarkan periode sejarah; selalu beri label
            "REKA ADEGAN • ILUSTRASI AI".
          - Peta, garis waktu, diagram, foto arsip, detail arsitektur, atau infografik.
          - Jangan mengarang koordinat atau menggunakan foto dokumentasi seolah-olah bebas lisensi.
          Untuk setiap scene sertakan narration, duration_seconds, visual_type, visual_prompt,
          on_screen_text, source_urls, visual_sourcing_note, dan visual_disclaimer.
          Pilih visual_type dari "real_location_photo", "ai_historical_reconstruction",
          "map_or_archive", atau "graphic".
          Sertakan camera/motion direction di visual_prompt agar aset mudah diproduksi.

          KOMPOSISI EDITORIAL:
          - Penjara Banceuy: sekitar 70% sejarah dan 30% atmosfer misteri.
          - Observatorium Bosscha: sekitar 70% atmosfer misteri/keingintahuan dan 30% sejarah/sains.
          - Jangan memaksakan unsur horor jika tidak didukung cerita atau fakta.

          KELUARAN: JSON valid saja, tanpa markdown, dengan skema:
          {{
            "title": "judul",
            "description": "deskripsi singkat",
            "duration_target_seconds": 75,
            "research": {{
              "verified_facts": ["..."],
              "legend_claims": ["..."],
              "unverified_or_disputed": ["..."],
              "source_urls": ["https://..."],
              "source_notes": [{{"source_name":"...","source_url":"...","supports":"..."}}],
              "research_notes": ["..."]
            }},
            "script": "narasi lengkap sekitar 130–190 kata",
            "storyboard": [
              {{
                "scene": 1,
                "duration_seconds": 8,
                "narration": "...",
                "visual_type": "ai_historical_reconstruction",
                "visual_prompt": "...",
                "on_screen_text": "...",
                "source_urls": [],
                "visual_sourcing_note": "...",
                "visual_disclaimer": "REKA ADEGAN • ILUSTRASI AI"
              }}
            ],
            "fact_check_status": "ready_for_human_review|insufficient_sources",
            "editorial_warnings": ["..."]
          }}
          Pastikan total durasi scene mendekati target narasi. Jangan menulis "kisah nyata"
          kecuali didukung bukti kuat. Hasil selalu membutuhkan pemeriksaan manusia sebelum render.
          """
          body = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.35, "maxOutputTokens": 8192}
          }
          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
              data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
              headers={"x-goog-api-key": os.environ["GEMINI_API_KEY"], "Content-Type": "application/json"},
              method="POST"
          )
          # Retry khusus untuk HTTP 503 (kapasitas layanan sementara).
          # Maksimal 5 retry setelah percobaan pertama; jeda eksponensial + jitter.
          retry_delays = [5, 10, 20, 40, 60]
          for attempt in range(len(retry_delays) + 1):
              try:
                  with urllib.request.urlopen(req, timeout=900) as response:
                      raw = response.read().decode("utf-8")
                  print(f"Gemini API berhasil pada percobaan ke-{attempt + 1}.")
                  break
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  if e.code == 503 and attempt < len(retry_delays):
                      delay = retry_delays[attempt] + random.uniform(0, 2)
                      print(
                          f"Gemini API HTTP 503 (UNAVAILABLE), percobaan "
                          f"{attempt + 1}/{len(retry_delays) + 1}. "
                          f"Mencoba ulang dalam {delay:.1f} detik.",
                          file=sys.stderr
                      )
                      time.sleep(delay)
                      continue
                  print(f"Gemini API HTTP {e.code}: {detail}", file=sys.stderr)
                  if e.code == 503:
                      print("Retry 503 sudah mencapai batas maksimal.", file=sys.stderr)
                  raise SystemExit(1)
          else:
              raise SystemExit("Gemini API gagal setelah seluruh percobaan ulang.")

          open("gemini-response-raw.json", "w", encoding="utf-8").write(raw)
          response = json.loads(raw)
          parts = response.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          generated = "\n".join(p.get("text", "") for p in parts if isinstance(p, dict) and p.get("text"))
          if not generated.strip():
              raise SystemExit("Gemini tidak mengembalikan teks paket cerita.")

          text = generated.strip()
          text = re.sub(r"^\s*```(?:json)?\s*", "", text, flags=re.I)
          text = re.sub(r"\s*```\s*$", "", text)
          try:
              package = json.loads(text)
          except json.JSONDecodeError:
              start, end = text.find("{"), text.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit("Respons Gemini bukan JSON valid.")
              package = json.loads(text[start:end+1])

          required = ["title", "research", "script", "storyboard", "fact_check_status"]
          missing = [k for k in required if k not in package]
          if missing or not isinstance(package.get("storyboard"), list) or not package["storyboard"]:
              raise SystemExit(f"Paket cerita tidak lengkap: {missing}")

          package["channel"] = config["slug"]
          package["topic_input"] = topic
          package["approval_required"] = True
          package["publishing_enabled"] = False
          with open("mystery-package.json", "w", encoding="utf-8") as f:
              json.dump(package, f, ensure_ascii=False, indent=2)

          print("Paket cerita berhasil dibuat.")
          print("Judul:", package["title"])
          print("Fact-check:", package["fact_check_status"])
          print("Jumlah scene:", len(package["storyboard"]))
          print("Sumber:", len(package.get("research", {}).get("source_urls", [])))

          # Resolve channel id; create Peta Sunyi once by reusing the existing owner's ID.
          base = os.environ["SUPABASE_URL"].rstrip("/")
          headers = {
              "apikey": os.environ["SUPABASE_SECRET_KEY"],
              "Authorization": "Bearer " + os.environ["SUPABASE_SECRET_KEY"],
              "Content-Type": "application/json"
          }
          def api(path, method="GET", payload=None, prefer=None):
              h = dict(headers)
              if prefer:
                  h["Prefer"] = prefer
              data = json.dumps(payload, ensure_ascii=False).encode() if payload is not None else None
              request = urllib.request.Request(base + "/rest/v1/" + path, data=data, headers=h, method=method)
              with urllib.request.urlopen(request, timeout=60) as r:
                  body = r.read().decode()
                  return json.loads(body) if body else []

          existing = api("channels?slug=eq.peta-sunyi&select=id&limit=1")
          if existing:
              channel_id = existing[0]["id"]
          else:
              owners = api("channels?name=eq.Sejarah%20Dunia&select=owner_id&limit=1")
              if not owners:
                  raise SystemExit("Channel Sejarah Dunia tidak ditemukan; tidak bisa menentukan owner_id untuk channel baru.")
              payload = {
                  "owner_id": owners[0]["owner_id"],
                  "slug": config["slug"],
                  "name": config["name"],
                  "config": config
              }
              created = api("channels", "POST", payload, "return=representation")
              if not created:
                  raise SystemExit("Gagal membuat record channel Peta Sunyi di Supabase.")
              channel_id = created[0]["id"]

          topic_payload = {
              "channel_id": channel_id,
              "title": package["title"],
              "status": "needs_review",
              "research": package.get("research", {})
          }
          topics = api("topics", "POST", topic_payload, "return=representation")
          if not topics:
              raise SystemExit("Paket dibuat tetapi gagal menyimpan topik ke Supabase.")
          topic_id = topics[0]["id"]

          script_payload = {
              "topic_id": topic_id,
              "version": 1,
              "body": package["script"],
              "storyboard": package["storyboard"],
              "status": "draft"
          }
          scripts = api("scripts", "POST", script_payload, "return=representation")
          if not scripts:
              raise SystemExit("Topik tersimpan tetapi gagal menyimpan naskah.")
          print("Channel ID:", channel_id)
          print("Topic ID:", topic_id)
          print("Script ID:", scripts[0]["id"])
          print("Status: draft — wajib diperiksa manusia sebelum produksi/publikasi.")
          PY

      - name: Upload mystery package for review
        uses: actions/upload-artifact@v4
        with:
          name: peta-sunyi-script
          path: |
            mystery-package.json
            gemini-response-raw.json
          if-no-files-found: error
          retention-days: 7
