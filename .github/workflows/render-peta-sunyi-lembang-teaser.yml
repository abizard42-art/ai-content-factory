name: Render Peta Sunyi Lembang teaser review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-teaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate vertical teaser visuals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p work/teaser output/teaser
          python - <<'PY'
          import json, os, subprocess, pathlib, base64
          cfg=json.load(open("episodes/peta-sunyi/teaser-lembang.json",encoding="utf-8"))
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          for i,prompt in enumerate(cfg["prompts"],1):
              body=json.dumps({"prompt":prompt,"steps":4})
              response=f"output/teaser/response-{i:02d}.json"
              status=subprocess.check_output([
                  "curl","--silent","--show-error","--output",response,"--write-out","%{http_code}",
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/@cf/black-forest-labs/flux-1-schnell",
                  "-X","POST","-H",f"Authorization: Bearer {token}",
                  "-H","Content-Type: application/json","-d",body
              ],text=True).strip()
              if status != "200":
                  raise SystemExit(f"Cloudflare HTTP {status} untuk shot {i}; cek response {response}")
              data=json.load(open(response))
              encoded=data.get("result",{}).get("image") or data.get("image")
              if not encoded:
                  raise SystemExit(f"Respons gambar kosong untuk shot {i}")
              pathlib.Path(f"work/teaser/shot-{i:02d}.jpg").write_bytes(base64.b64decode(encoded))
              print(f"TEASER_VISUAL_OK=shot-{i:02d}")
          PY
      - name: Generate Indonesian cinematic baritone narration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          cfg=json.load(open("episodes/peta-sunyi/teaser-lembang.json",encoding="utf-8"))
          subprocess.run([
              "edge-tts","--voice",cfg["voice"],"--rate",cfg["rate"],
              "--text",cfg["narration"],"--write-media","output/teaser/teaser.mp3"
          ],check=True,timeout=240)
          PY
      - name: Render vertical 9:16 teaser
        run: |
          python -m py_compile scripts/peta-sunyi/render_teaser.py
          python scripts/peta-sunyi/render_teaser.py
      - uses: actions/upload-artifact@v4
        with:
          name: peta-sunyi-lembang-teaser-review
          path: output/peta-sunyi-lembang-teaser-review.mp4
          if-no-files-found: error
          retention-days: 7
